# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - pomo

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      swap_to_production:
        description: 'Swap test1 slot into production after a healthy deploy'
        required: false
        default: false
        type: boolean

env:
  AZURE_WEBAPP_NAME: pomo
  AZURE_STAGING_SLOT: test1
  APP_STARTUP_COMMAND: npm --prefix src/api run start

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm ci
          npm --prefix src/api ci
          npm run build
          npm --prefix src/api run build
          npm run test --if-present

      - name: Prepare deploy package
        run: |
          rm -rf deploy
          mkdir -p deploy/dist
          mkdir -p deploy/src/api
          cp -R dist/. deploy/dist/
          cp -R src/api/dist deploy/src/api/dist
          cp src/api/package.json deploy/src/api/package.json
          cp src/api/package-lock.json deploy/src/api/package-lock.json
          cp src/api/tsconfig.json deploy/src/api/tsconfig.json
          cp src/api/.funcignore deploy/src/api/.funcignore || true
          cp package.json deploy/package.json

      - name: Install API production dependencies in deploy package
        run: |
          npm --prefix deploy/src/api ci --omit=dev

      - name: Verify deploy package contents
        run: |
          test -f deploy/dist/index.html
          test -f deploy/src/api/dist/server.js
          test -f deploy/src/api/node_modules/express/package.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: pomo-appservice-onedeploy
      cancel-in-progress: false
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_565BE6C6A9EA484A83FFD559E2AC7D69 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D973C448A770474B91CA1E69470D1E7F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_33D8C6649C79408B9268589A55FF4C4F }}

      - name: 'Deploy to Azure Web App (attempt 1)'
        id: deploy-to-webapp
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_STAGING_SLOT }}
          startup-command: ${{ env.APP_STARTUP_COMMAND }}
          package: .

      - name: Wait before retry after transient deployment conflict
        if: steps.deploy-to-webapp.outcome == 'failure'
        run: sleep 45

      - name: 'Deploy to Azure Web App (attempt 2)'
        if: steps.deploy-to-webapp.outcome == 'failure'
        id: deploy-to-webapp-retry
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_STAGING_SLOT }}
          startup-command: ${{ env.APP_STARTUP_COMMAND }}
          package: .

      - name: Warm staging slot before production swap
        if: github.event_name == 'push' || inputs.swap_to_production == true
        run: |
          staging_health_url="https://${AZURE_WEBAPP_NAME}-${AZURE_STAGING_SLOT}.azurewebsites.net/api/lists"
          for attempt in {1..18}; do
            status_code=$(curl --silent --show-error --location --output /dev/null --write-out "%{http_code}" "$staging_health_url" || true)
            if [ "$status_code" = "200" ]; then
              echo "Staging slot health check passed."
              exit 0
            fi

            echo "Staging slot health check attempt ${attempt} returned ${status_code}; retrying."
            sleep 10
          done

          echo "::error::Staging slot did not pass health check at ${staging_health_url}."
          exit 1

      - name: Swap staging slot into production
        if: github.event_name == 'push' || inputs.swap_to_production == true
        run: |
          resource_group=$(az webapp list --query "[?name=='${AZURE_WEBAPP_NAME}'].resourceGroup | [0]" --output tsv)
          if [ -z "$resource_group" ]; then
            echo "::error::Could not resolve resource group for App Service ${AZURE_WEBAPP_NAME}."
            exit 1
          fi

          az webapp deployment slot swap \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$resource_group" \
            --slot "$AZURE_STAGING_SLOT" \
            --target-slot production

          